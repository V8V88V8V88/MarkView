app-id: io.github.v8v88v8v88.MarkView
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: markview

modules:
  - name: markview
    buildsystem: simple
    build-commands:
      - bash -c 'export PATH="/usr/lib/sdk/rust-stable/bin:$PATH" && cargo build --release'
      - install -Dm755 target/release/gtk-markdown-viewer /app/bin/markview
      - mkdir -p /app/share/gtksourceview-5/styles
      - install -Dm644 data/styles/*.xml /app/share/gtksourceview-5/styles/
      - install -Dm644 data/icons/hicolor/256x256/apps/io.github.v8v88v8v88.MarkView.png /app/share/icons/hicolor/256x256/apps/io.github.v8v88v8v88.MarkView.png
      - install -Dm644 data/io.github.v8v88v8v88.MarkView.desktop /app/share/applications/io.github.v8v88v8v88.MarkView.desktop
      - install -Dm644 data/io.github.v8v88v8v88.MarkView.metainfo.xml /app/share/metainfo/io.github.v8v88v8v88.MarkView.metainfo.xml
    sources:
      - type: dir
        path: ..
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
