name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this hasn't been suggested yet
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: It's hard to … when …
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

  - type: textarea
    id: screenshots
    attributes:
      label: Mockups or screenshots
      description: Drag and drop images here.
