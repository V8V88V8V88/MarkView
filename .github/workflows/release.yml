name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # The runner's own Ubuntu ships too old a libadwaita, so build inside
    # Ubuntu 26.04 LTS (GNOME 50: GTK 4.22, libadwaita 1.9), which covers the
    # GTK 4.12 / libadwaita 1.8 / GtkSourceView 5.4 floor set in Cargo.toml.
    container: ubuntu:26.04
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libgtksourceview-5-dev

      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Create tarball
        run: |
          mkdir -p markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          cp target/release/gtk-markdown-viewer markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu/markview
          cp LICENSE README.md markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu/
          cp -r data markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu/
          tar czvf markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-flatpak:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
          # GNOME 51 is built on freedesktop SDK 26.08
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # flatpak-builder has no network access, so fetch the crates beforehand
      - name: Vendor crates
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean build flatpak/io.github.v8v88v8v88.MarkView.yml

      - name: Export Flatpak bundle
        run: |
          flatpak build-export repo build
          flatpak build-bundle repo MarkView-${{ github.ref_name }}.flatpak io.github.v8v88v8v88.MarkView

      - name: Upload Flatpak to Release
        uses: softprops/action-gh-release@v3
        with:
          files: MarkView-${{ github.ref_name }}.flatpak
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
