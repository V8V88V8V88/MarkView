name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # The GTK 4.24 / libadwaita 1.10 / GtkSourceView 5.22 floor set in
    # Cargo.toml is newer than any Ubuntu release, so build in Fedora 45
    # (GNOME 51), which ships exactly those.
    container: fedora:45
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkgconf-pkg-config \
            gtk4-devel libadwaita-devel gtksourceview5-devel webkitgtk6.0-devel

      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create tarball
        run: |
          mkdir -p markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          cp target/release/gtk-markdown-viewer markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu/markview
          cp LICENSE README.md markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu/
          cp -r data markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu/
          tar czvf markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: markview-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # Tags like v2.1.0-beta.1 become pre-releases, not "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # GTK, libadwaita and GtkSourceView come from MSYS2's UCRT64
      # environment, and so does Rust, so the C and Rust sides share one
      # toolchain and C runtime.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build and bundle
        run: bash scripts/bundle-windows.sh

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/markview-*-x86_64-pc-windows-gnu.zip
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    # Homebrew only has GTK bottles for Apple Silicon.
    runs-on: macos-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: brew install pkgconf gtk4 libadwaita gtksourceview5 adwaita-icon-theme

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create tarball
        run: |
          NAME=markview-${{ github.ref_name }}-aarch64-apple-darwin
          mkdir -p $NAME
          cp target/release/gtk-markdown-viewer $NAME/markview
          cp LICENSE README.md $NAME/
          cp -r data $NAME/
          tar czvf $NAME.tar.gz $NAME

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: markview-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-flatpak:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
          # GNOME 51 is built on freedesktop SDK 26.08
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # flatpak-builder has no network access, so fetch the crates beforehand
      - name: Vendor crates
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean build flatpak/com.v8v88v8v88.MarkView.yml

      - name: Export Flatpak bundle
        run: |
          flatpak build-export repo build
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo repo MarkView-${{ github.ref_name }}.flatpak com.v8v88v8v88.MarkView

      - name: Upload Flatpak to Release
        uses: softprops/action-gh-release@v3
        with:
          files: MarkView-${{ github.ref_name }}.flatpak
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
