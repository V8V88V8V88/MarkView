[package]
name = "gtk-markdown-viewer"
version = "2.1.0-beta.6"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_24"] }
sourceview5 = { version = "0.11", features = ["v5_22"] }
pulldown-cmark = "0.13.6"

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_10"]

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
webkit6 = "0.6"

# wry's Linux backend is GTK 3, so it's only used on Windows and macOS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
raw-window-handle = "0.6"
serde_json = "1"

# Must match wry's versions.
[target.'cfg(windows)'.dependencies]
gdk4-win32 = "0.11"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
gdk4-macos = { version = "0.11", features = ["v4_8"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSURL", "NSValue", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSGraphics", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }
