[package]
name = "gtk-markdown-viewer"
version = "2.0.1"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
sourceview5 = { version = "0.11", features = ["v5_4"] }
pulldown-cmark = "0.13.6"
webkit6 = "0.6"

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_8"]
